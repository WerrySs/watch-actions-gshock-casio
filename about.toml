# Include all transitive runtime dependencies for the distributed platforms.
accepted = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "ISC", "MPL-2.0", "NCSA",
  "Unicode-3.0", "Unlicense", "Zlib", "LicenseRef-Slint-Royalty-free-2.0",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Slint offers this license explicitly. Verify its bundled text instead of
# relying on SPDX text synthesis for a custom LicenseRef.
[slint.clarify]
license = "LicenseRef-Slint-Royalty-free-2.0"
[[slint.clarify.files]]
path = "LICENSES/LicenseRef-Slint-Royalty-free-2.0.md"
checksum = "5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe"

