name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome on macOS, Windows, or both.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy and safety impact
      description: Explain any new data, permissions, network access, Bluetooth behavior, or computer action.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Relevant model family
      description: Optional. Do not include unique device identifiers.
