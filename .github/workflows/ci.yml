name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  security:
    name: Security checks
    uses: ./.github/workflows/security.yml

  rust-core:
    name: Rust core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-core-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-core-
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test shared core
        run: cargo test --locked --package watchbridge-core
      - name: Lint shared core and packaging
        run: cargo clippy --locked --package watchbridge-core --package xtask --all-targets -- -D warnings

  macos:
    name: macOS client
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-native-
      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build shared Rust library
        run: cargo xtask prepare-macos
      - name: Test native macOS client
        run: swift test --package-path apps/macos
      - name: Package universal macOS review app
        env:
          WATCHBRIDGE_UNIVERSAL: "1"
          WATCHBRIDGE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cargo xtask package-macos
          lipo dist/macos/WatchBridge.app/Contents/MacOS/WatchBridge -verify_arch arm64 x86_64
          dist/macos/WatchBridge.app/Contents/MacOS/WatchBridge --smoke-test
      - name: Upload macOS review downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WatchBridge-macOS-universal-review
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
            dist/macos/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Render sample-data documentation previews
        run: |
          for page in watch actions watches settings; do
            dist/macos/WatchBridge.app/Contents/MacOS/WatchBridge --snapshot "$RUNNER_TEMP/watchbridge-previews/default" --full-window --only "$page"
          done
          for page in watch actions settings; do
            dist/macos/WatchBridge.app/Contents/MacOS/WatchBridge --snapshot "$RUNNER_TEMP/watchbridge-previews/minimum" --full-window --minimum-size --only "$page"
          done
          dist/macos/WatchBridge.app/Contents/MacOS/WatchBridge --snapshot "$RUNNER_TEMP/watchbridge-previews/full-page" --full-window --full-page --only actions
          dist/macos/WatchBridge.app/Contents/MacOS/WatchBridge --snapshot "$RUNNER_TEMP/watchbridge-previews/layers" --full-window --full-page --action-layers --only actions
          dist/macos/WatchBridge.app/Contents/MacOS/WatchBridge --snapshot "$RUNNER_TEMP/watchbridge-previews/layers-minimum" --full-window --minimum-size --full-page --action-layers --only actions
          dist/macos/WatchBridge.app/Contents/MacOS/WatchBridge --snapshot "$RUNNER_TEMP/watchbridge-previews/keyboard" --only keyboard
      - name: Upload documentation previews for visual review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WatchBridge-macOS-documentation-previews
          path: ${{ runner.temp }}/watchbridge-previews/**/*.png
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows client
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-native-
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Test shared core
        run: cargo test --locked --package watchbridge-core
      - name: Test Windows client
        run: cargo test --locked --package watchbridge-windows
      - name: Lint Windows client
        run: cargo clippy --locked --package watchbridge-windows --all-targets -- -D warnings
      - name: Build Windows client
        run: cargo build --locked --release --package watchbridge-windows
      - name: Package Windows review app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = ((cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq "watchbridge-core").version
          $folder = "dist/windows/WatchBridge"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item "target/release/watchbridge-windows.exe" "$folder/WatchBridge.exe"
          Copy-Item "LICENSE" "$folder/LICENSE.txt"
          Copy-Item "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.txt", "README.md" $folder
          $process = Start-Process -FilePath "$folder/WatchBridge.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Windows startup smoke check timed out." }
          if ($process.ExitCode -ne 0) { throw "Windows startup smoke check failed." }
          $archive = "dist/windows/WatchBridge-v$version-Windows-x64.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("dist/windows/WatchBridge-v$version-Windows-x64.sha256", "$hash  $(Split-Path -Leaf $archive)`n", [Text.UTF8Encoding]::new($false))
      - name: Upload Windows review downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WatchBridge-Windows-x64-review
          path: |
            dist/windows/*.zip
            dist/windows/*.sha256
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required checks
    if: always()
    needs: [rust-core, security, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native and security check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
