name: Security

on:
  # CI invokes this for every PR, including documentation-only changes, so the
  # required check cannot stay pending because of a workflow-level path filter.
  workflow_call:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject private workspace data and credentials
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.ai|\.workos)(/|$)'; then
            echo "Private WorkOS data must never be tracked." >&2
            exit 1
          fi
          if git ls-files | grep -E '\.(p12|pfx|pem|key|mobileprovision)$'; then
            echo "Signing material or private keys must never be tracked." >&2
            exit 1
          fi
          if git grep -IEl '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})' -- . ':!Cargo.lock'; then
            echo "A credential-like value is present in tracked source." >&2
            exit 1
          fi
      - name: Scan complete Git history with pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaks-ignore" \
            --log-opts="--all --full-history" --timeout 120

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache pinned security tools
        id: security-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/watchbridge-security-tools
          key: security-tools-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-audit0.22.2-deny0.20.2-about0.9.2-cli
      - name: Install security tools
        if: steps.security-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --root "$HOME/.cache/watchbridge-security-tools" --target-dir "$RUNNER_TEMP/watchbridge-security-build"
          cargo install cargo-deny --version 0.20.2 --locked --root "$HOME/.cache/watchbridge-security-tools" --target-dir "$RUNNER_TEMP/watchbridge-security-build"
          cargo install cargo-about --version 0.9.2 --features cli --locked --root "$HOME/.cache/watchbridge-security-tools" --target-dir "$RUNNER_TEMP/watchbridge-security-build"
      - name: Add security tools to PATH
        run: echo "$HOME/.cache/watchbridge-security-tools/bin" >> "$GITHUB_PATH"
      - name: Verify installed tool versions
        run: |
          cargo audit --version
          cargo deny --version
          cargo about --version
      - name: Check known vulnerabilities
        run: cargo audit
      - name: Check licenses, sources, and dependency policy
        run: cargo deny check --hide-inclusion-graph advisories bans licenses sources
      - name: Verify bundled third-party license texts
        run: |
          cargo about generate --workspace --locked --fail .github/licenses.hbs --output-file THIRD_PARTY_LICENSES.txt
          git diff --exit-code -- THIRD_PARTY_LICENSES.txt
