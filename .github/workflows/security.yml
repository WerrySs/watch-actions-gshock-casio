name: Security

on:
  push:
    branches: [main]
    paths: [Cargo.lock, '**/Cargo.toml', deny.toml, about.toml, THIRD_PARTY_LICENSES.txt, .github/licenses.hbs, .github/workflows/security.yml]
  pull_request:
    branches: [main]
    paths: [Cargo.lock, '**/Cargo.toml', deny.toml, about.toml, THIRD_PARTY_LICENSES.txt, .github/licenses.hbs, .github/workflows/security.yml]
  workflow_call:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache pinned security tools
        id: security-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/watchbridge-security-tools
          key: security-tools-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-audit0.22.2-deny0.20.2-about0.9.2-cli
      - name: Install security tools
        if: steps.security-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --root "$HOME/.cache/watchbridge-security-tools" --target-dir "$RUNNER_TEMP/watchbridge-security-build"
          cargo install cargo-deny --version 0.20.2 --locked --root "$HOME/.cache/watchbridge-security-tools" --target-dir "$RUNNER_TEMP/watchbridge-security-build"
          cargo install cargo-about --version 0.9.2 --features cli --locked --root "$HOME/.cache/watchbridge-security-tools" --target-dir "$RUNNER_TEMP/watchbridge-security-build"
      - name: Add security tools to PATH
        run: echo "$HOME/.cache/watchbridge-security-tools/bin" >> "$GITHUB_PATH"
      - name: Verify installed tool versions
        run: |
          cargo audit --version
          cargo deny --version
          cargo about --version
      - name: Check known vulnerabilities
        run: cargo audit
      - name: Check licenses, sources, and dependency policy
        run: cargo deny check --hide-inclusion-graph advisories bans licenses sources
      - name: Verify bundled third-party license texts
        run: |
          cargo about generate --workspace --locked --fail .github/licenses.hbs --output-file THIRD_PARTY_LICENSES.txt
          git diff --exit-code -- THIRD_PARTY_LICENSES.txt
